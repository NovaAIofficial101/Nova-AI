<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova AI Video Generator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎬 Nova AI Video Generator</h1>

<p>Create AI videos from text or image</p>

<br>

<input type="file" id="image">

<br><br>

<textarea id="prompt" placeholder="Describe your video..."></textarea>

<br><br>

<select id="duration">
<option>5 Seconds</option>
<option>10 Seconds</option>
<option>20 Seconds</option>
<option>30 Seconds</option>
</select>

<br><br>

<button id="generateBtn">Generate Video</button>

<br><br>

<progress id="progress" value="0" max="100" style="width:100%;"></progress>

<br><br>

<a id="downloadBtn" href="#" download style="display:none;">⬇ Download Video</a>

</div>

<script src="script.js"></script>

</body>
</html>
