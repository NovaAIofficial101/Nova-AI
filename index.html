<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Video Generator</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:700px;
background:#1f2937;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:#8b5cf6;
}

textarea{
width:100%;
height:150px;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:20px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#8b5cf6;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#7c3aed;
}
</style>
</head>

<body>

<div class="container">
<h1>Nova AI Video Generator</h1>

<textarea placeholder="Describe your video..."></textarea>

<button>Generate Video</button>

</div>

</body>
</html>
